name: Propagate security fixes from main to master

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  propagate-if-merged:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'security')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create propagation PR with gh CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Ensure latest state
          git fetch origin master:master

          # Log divergence for debug
          ahead_count=$(git rev-list --count master..HEAD)
          echo "Commits ahead of master: $ahead_count"
          if [ "$ahead_count" -eq 0 ]; then
            echo "No new changes - skipping PR creation"
            exit 0
          fi

          # Create the PR (will fail gracefully if already exists)
          gh pr create \
            --base master \
            --head main \
            --title "chore(security): propagate npm audit fixes to master" \
            --body "Auto-created after merging security fixes to main.\nOriginal PR: ${{ github.event.pull_request.html_url }}\n\n**Manual merge required** – review (note: large package-lock.json diffs expected), test, then merge.\n\nDiff: https://github.com/${{ github.repository }}/compare/master...main" \
            --label dependencies,security || echo "PR creation failed/skipped (likely already exists or no diff)"