name: Propagate security fixes from develop to master

on:
  pull_request:
    types: [closed]
    branches:
      - develop
  workflow_dispatch:
    inputs:
      security_pr_number:
        description: "Merged dependabot_security PR number from develop"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  propagate-if-merged:
    if: |
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       contains(github.event.pull_request.labels.*.name, 'dependabot_security')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Create security-only propagation PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin --no-tags

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            security_pr_number="${{ github.event.inputs.security_pr_number }}"
          else
            security_pr_number="${{ github.event.pull_request.number }}"
          fi

          propagation_branch="auto-security-propagation-${security_pr_number}-${GITHUB_RUN_ID}"

          # Start from master and only apply commits from the merged security PR.
          git checkout -B "$propagation_branch" origin/master

          commits=$(gh api \
            repos/${{ github.repository }}/pulls/${security_pr_number}/commits \
            --jq '.[].sha')

          if [ -z "$commits" ]; then
            echo "No commits found in security PR #${security_pr_number}. Skipping."
            exit 0
          fi

          original_pr_url="https://github.com/${{ github.repository }}/pull/${security_pr_number}"

          for sha in $commits; do
            echo "Cherry-picking commit: $sha"
            git cherry-pick -x "$sha"
          done

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to propagate after cherry-picking. Skipping PR creation."
            exit 0
          fi

          git push --set-upstream origin "$propagation_branch"

          gh pr create \
            --base master \
            --head "$propagation_branch" \
            --title "chore(security): propagate npm audit fixes to master" \
            --body "Auto-created after merging security fixes to develop.\nOriginal PR: ${original_pr_url}\n\nThis PR cherry-picks only commits from the merged \`dependabot_security\` PR (not the full \`develop\` branch).\n\n**Manual merge required** - review lockfile changes, run tests, then merge." \
            --label dependencies,security
