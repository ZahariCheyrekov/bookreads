name: Propagate security fixes from main to master

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  propagate-if-merged:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'security')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create propagation PR with gh CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch latest master to compare
          git fetch origin master:master

          # Check diff count
          ahead=$(git rev-list --count master..HEAD)
          echo "Commits ahead of master: $ahead"

          if [ "$ahead" -eq 0 ]; then
            echo "No changes to propagate - branches are identical"
            exit 0
          fi

          # Create PR
          gh pr create \
            --base master \
            --head main \
            --title "chore(security): propagate npm audit fixes to master" \
            --body "Auto-created after merging security fixes to main.\nOriginal PR: ${{ github.event.pull_request.html_url }}\n\n**Manual merge required** – review changes (including large lockfile diffs), run tests, then merge when ready." \
            --label dependencies,security || echo "PR creation skipped (may already exist or other issue)"
