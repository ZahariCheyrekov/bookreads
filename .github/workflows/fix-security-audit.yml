name: Auto-fix npm security vulnerabilities (server)

on:
  schedule:
    - cron: "0 3 * * *" # daily at 3 AM UTC – feel free to change
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  audit-and-fix-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js for server
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: bookreads/server/package-lock.json

      - name: Install dependencies (server)
        working-directory: bookreads/server
        run: npm ci --legacy-peer-deps

      - name: Run npm audit fix (server)
        working-directory: bookreads/server
        run: npm audit fix --legacy-peer-deps
        continue-on-error: true

      - name: Create PR to main (if server changes)
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(security): auto-fix npm vulnerabilities in server --legacy-peer-deps"
          title: "chore(security): npm audit fix updates (server)"
          body: |
            Automated `npm audit fix --legacy-peer-deps` in /bookreads/server.

            - Fixes applied where possible.
            - Review dependency changes and test the server before merging to main.
          branch: auto-security-fixes-server
          delete-branch: true
          base: main
          labels: dependencies, security, server
